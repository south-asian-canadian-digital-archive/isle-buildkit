name: SACDA hypercube (libvips)
# Builds hypercube from this branch (Tesseract input normalised by libvips
# instead of the ImageMagick it never had) as a SACDA image, until upstream has it.
#   ghcr.io/south-asian-canadian-digital-archive/hypercube:vips-<ISLANDORA_TAG>
on:
  push:
    branches: [hypercube-vips]
    paths:
      - "images/hypercube/**"
      - ".github/workflows/sacda-hypercube.yml"
  workflow_dispatch:
    inputs:
      islandora_tag:
        description: "isle-buildkit release to build on (scyllaridae base)"
        required: true
        default: "7.0.22"

permissions:
  contents: read
  packages: write

env:
  ISLANDORA_TAG: ${{ inputs.islandora_tag || '7.0.22' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/hypercube

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/hypercube
          build-contexts: |
            scyllaridae=docker-image://islandora/scyllaridae:${{ env.ISLANDORA_TAG }}
            leptonica=docker-image://islandora/leptonica:${{ env.ISLANDORA_TAG }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:vips-${{ env.ISLANDORA_TAG }}
            ${{ env.IMAGE }}:vips-${{ env.ISLANDORA_TAG }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Islandora hypercube with libvips input normalisation
          cache-from: type=gha
          cache-to: type=gha,mode=max
